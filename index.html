<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>ENGLISH 6 – MID-TERM 1 REVISION 2026–2027</title>
<style>
:root{
  --bg1:#eaf3ff; --bg2:#fff6e8; --ink:#1d2433; --muted:#5f6b85; --line:#dbe3f3;
  --card:#ffffff; --pri:#3366ff; --pri-d:#2449c7; --pri-l:#e6edff;
  --ok:#17a35f; --ok-l:#e3f7ec; --bad:#e04848; --bad-l:#fdeaea; --warn:#f5a524; --warn-l:#fff4dc;
  --radius:18px; --shadow:0 6px 22px rgba(40,70,140,.12);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;font-size:17px;line-height:1.5}
.wrap{max-width:920px;margin:0 auto;padding:14px 14px 60px}
h1,h2,h3{margin:0}
.hero{background:linear-gradient(135deg,#3366ff,#6a4cff);color:#fff;border-radius:24px;padding:22px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{font-size:clamp(22px,5vw,34px);letter-spacing:.3px}
.hero p{margin:6px 0 0;opacity:.95}
.hero .deco{position:absolute;right:12px;top:6px;font-size:54px;opacity:.25;letter-spacing:6px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-top:14px}
.card h2{font-size:20px;margin-bottom:10px}
.muted{color:var(--muted)} .tiny{font-size:13px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--line);border-radius:16px;padding:12px 14px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit}
.mode b{display:block;font-size:17px}
.mode.on{border-color:var(--pri);background:var(--pri-l)}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.rd{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:16px;padding:10px 12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit}
.rd .ic{font-size:26px;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:var(--pri-l);flex:none}
.rd b{display:block;line-height:1.2} .rd small{color:var(--muted)}
.rd.on{border-color:var(--c,var(--pri));background:color-mix(in srgb,var(--c,var(--pri)) 9%,#fff)}
.rd.on .ic{background:color-mix(in srgb,var(--c,var(--pri)) 20%,#fff)}
.rd.dim{opacity:.75;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
select,input[type=text]{font:inherit;padding:9px 11px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
select:focus,input[type=text]:focus{outline:3px solid #b9ccff;border-color:var(--pri)}
label.chk{display:flex;align-items:center;gap:8px;cursor:pointer}
label.chk input{width:20px;height:20px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 20px;cursor:pointer;background:var(--pri);color:#fff;box-shadow:0 4px 0 var(--pri-d);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--pri-d)}
.btn.big{font-size:19px;padding:14px 30px}
.btn.ghost{background:#fff;color:var(--pri);box-shadow:0 0 0 2px var(--pri) inset}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #0f7a46}
.btn.warn{background:#ff9f1a;box-shadow:0 4px 0 #c97800}
.btn.small{padding:7px 12px;font-size:15px;border-radius:11px;box-shadow:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
ul.rules{margin:6px 0 0;padding-left:20px} ul.rules li{margin:4px 0}
details{margin-top:6px} summary{cursor:pointer;font-weight:700}
.flag{border-left:4px solid var(--warn);background:var(--warn-l);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:15px}
/* quiz */
.top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.pill{background:#fff;border-radius:999px;padding:5px 12px;box-shadow:var(--shadow);font-weight:700;font-size:15px}
.bar{height:12px;background:#dfe7fb;border-radius:999px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#3366ff,#6a4cff);border-radius:999px;transition:width .3s}
.qtag{display:inline-block;font-size:13px;font-weight:700;color:var(--muted);background:#eef2fb;border-radius:8px;padding:2px 8px;margin-bottom:6px}
.instr{font-weight:700;color:var(--pri-d);margin-bottom:8px}
.stem{font-size:20px;margin:6px 0 12px;font-weight:600}
.note{background:var(--warn-l);border-left:4px solid var(--warn);border-radius:8px;padding:7px 11px;font-size:14px;margin:8px 0;color:#6b4a00}
.opts{display:grid;gap:10px;margin-top:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;font-size:18px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;color:var(--ink);width:100%}
.opt .lt{flex:none;width:34px;height:34px;border-radius:10px;background:var(--pri-l);color:var(--pri-d);display:grid;place-items:center;font-weight:800}
.opt:hover{border-color:#9db6ff}
.opt.sel{border-color:var(--pri);background:var(--pri-l)}
.opt.correct{border-color:var(--ok);background:var(--ok-l)} .opt.correct .lt{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)} .opt.wrong .lt{background:var(--bad);color:#fff}
.locked{pointer-events:none}
.fig{margin:8px 0;text-align:center}
.fig img{max-width:min(100%,420px);width:100%;height:auto;border:2px solid var(--line);border-radius:12px;background:#fff;padding:6px;image-rendering:auto}
.fig figcaption{font-size:13px;color:var(--muted);margin-top:4px}
.passage{background:#f8faff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;max-height:340px;overflow:auto}
.passage .ptitle{font-weight:800;margin-bottom:6px;color:var(--pri-d)}
.passage p{margin:0 0 8px}
mark{background:#ffe27a;padding:0 2px;border-radius:4px}
.blank{display:inline-block;padding:0 6px;border-radius:7px;background:#eef1f8;color:var(--muted);font-weight:600;white-space:nowrap}
.blank.cur{background:#fff0b8;color:#7a5200;box-shadow:0 0 0 2px #ffcf4d}
.blank.ok{background:var(--ok-l);color:#0f7a46;box-shadow:0 0 0 2px var(--ok)}
.blank.bad{background:var(--bad-l);color:#a02323;box-shadow:0 0 0 2px var(--bad)}
.blank.done{background:var(--ok-l);color:#0f7a46}
.fin,.win{border:0;border-bottom:3px solid #8fa8ff;border-radius:6px 6px 0 0;background:#f2f6ff;padding:4px 8px;margin:0 3px;min-width:140px;max-width:100%;font-weight:700;color:var(--pri-d)}
.fin.ok,.win.ok{background:var(--ok-l);border-color:var(--ok);color:#0f7a46}
.fin.bad,.win.bad{background:var(--bad-l);border-color:var(--bad);color:#a02323}
.win{width:100%;min-width:0;display:block;margin:8px 0 0;font-size:18px;padding:10px 12px;border-radius:12px;border:2px solid var(--line)}
.win.ok,.win.bad{border:2px solid}
.warrow{margin-top:8px;font-size:19px}
.wprompt{font-size:20px;font-weight:700;margin:4px 0}
.seq{display:grid;gap:8px;margin:6px 0 12px}
.cs{display:flex;gap:10px;align-items:center;background:#fff;border:2px solid var(--pri);border-radius:14px;padding:8px 10px}
.cs.ok{border-color:var(--ok);background:var(--ok-l)} .cs.bad{border-color:var(--bad);background:var(--bad-l)}
.cs .pos{flex:none;width:28px;height:28px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.cs .ct{flex:1}
.cs .mv{display:flex;gap:4px}
.cs .mv button{border:2px solid var(--line);background:#fff;border-radius:9px;width:34px;height:34px;font-size:16px;cursor:pointer}
.cs .mv button:disabled{opacity:.35}
.emptyseq{border:2px dashed var(--line);border-radius:14px;padding:14px;color:var(--muted);text-align:center}
.pool{display:grid;gap:8px}
.cc{text-align:left;font:inherit;background:#fffdf3;border:2px solid #f0dfa0;border-radius:14px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.cc:hover{border-color:#e6b800}
.choices{display:grid;gap:6px;margin:6px 0 12px}
.chc{background:#f8faff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:16px}
.chc.used{opacity:.45;text-decoration:line-through}
.chc b{color:var(--pri-d);margin-right:4px}
.chat{display:grid;gap:10px}
.msg{display:flex;flex-direction:column;max-width:92%;min-width:0}
.msg.wide{width:100%;max-width:100%}
.msg.l{align-self:flex-start} .msg.r{align-self:flex-end;align-items:flex-end}
.who{font-size:13px;font-weight:700;color:var(--muted);margin:0 6px 2px}
.bub{background:#eaf1ff;border-radius:18px 18px 18px 6px;padding:9px 13px;font-size:17px}
.msg.r .bub{background:#e7f8ee;border-radius:18px 18px 6px 18px}
.bub{min-width:0;max-width:100%;overflow-wrap:anywhere}
.msg.wide .bub{width:100%}
.bub select{width:100%;max-width:100%;font-size:16px;margin:4px 0}
.chat{grid-template-columns:minmax(0,1fr)}
.bub select.ok{border-color:var(--ok);background:var(--ok-l)} .bub select.bad{border-color:var(--bad);background:var(--bad-l)}
.fill{display:inline-block;border-radius:8px;padding:0 6px;font-weight:700}
.fill.ok{background:var(--ok-l);color:#0f7a46} .fill.bad{background:var(--bad-l);color:#a02323}
.chat-wrap{background:#fff}
.listen{background:#f1fbf4;border:2px solid #bfe6cc;border-radius:14px;padding:10px 12px;margin-bottom:10px}
.listen .lt2{font-weight:800;margin-bottom:6px}
.listen .lb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.script{background:#fff;border-radius:10px;padding:8px 10px;margin-top:8px;font-size:15px;max-height:220px;overflow:auto}
.script div{margin:3px 0}
.fb{border-radius:14px;padding:12px 14px;margin-top:14px;font-size:17px}
.fb.ok{background:var(--ok-l);border:2px solid var(--ok)} .fb.bad{background:var(--bad-l);border:2px solid var(--bad)}
.fb.part{background:var(--warn-l);border:2px solid var(--warn)}
.fb h3{font-size:20px;margin-bottom:4px}
.fb .ans{margin-top:6px} .fb .exp{margin-top:6px;color:#33405e}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:16px}
.actions .left{margin-right:auto}
.hintbox{background:#eef6ff;border:2px dashed #9ec1ff;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:15px}
/* summary */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:#f5f8ff;border-radius:14px;padding:10px;text-align:center}
.tile b{display:block;font-size:26px} .tile span{font-size:13px;color:var(--muted)}
.bigscore{font-size:46px;font-weight:900;color:var(--pri-d)}
.hb{display:grid;grid-template-columns:150px 1fr 70px;gap:8px;align-items:center;margin:7px 0;font-size:15px}
.hb .tr{height:16px;background:#e8edf9;border-radius:99px;overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:99px;background:var(--c,#3366ff)}
.rev{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;background:#fff}
.rev.wrong{border-color:#f3b4b4;background:#fff8f8} .rev.skipped{border-color:#f0d9a0;background:#fffdf5} .rev.partial{border-color:#f0d9a0;background:#fffdf5}
.rev .tag{font-size:12px;font-weight:800;border-radius:7px;padding:1px 7px;margin-right:6px}
.tag.correct{background:var(--ok-l);color:#0f7a46} .tag.wrong{background:var(--bad-l);color:#a02323} .tag.partial,.tag.skipped{background:var(--warn-l);color:#7a5200}
.advice{border-left:4px solid var(--pri);background:var(--pri-l);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:15px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#1d2433;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;z-index:50;font-size:15px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.conf{position:fixed;top:32%;width:9px;height:13px;z-index:40;pointer-events:none;animation:conf 1s ease-out forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:600px){
  body{font-size:16px}
  .modes{grid-template-columns:1fr}
  .stem{font-size:18px}
  .opt{font-size:16.5px;padding:10px 11px}
  .hb{grid-template-columns:96px 1fr 58px;font-size:13.5px}
  .bigscore{font-size:38px}
  .actions .btn{flex:1 1 auto}
  .msg{max-width:100%}
}
</style>
</head>

m": "There are six rooms in Mai's house.", "opts": ["True", "False"], "ans": 1, "exp": "Mai nói có 5 phòng: 2 bedrooms, living room, kitchen, bathroom; không phải 6.", "listen": "T2"}, {"id": "r9-b3", "round": "r9", "type": "mcq", "ref": "Listening · Task 2 · Statement 3", "instr": "Nghe hội thoại và quyết định câu sau đúng (True) hay sai (False).", "stem": "Mai likes her bedroom best because it is big and modern.", "opts": ["True", "False"], "ans": 1, "exp": "Mai thích bedroom nhất, nhưng phòng “small but cozy”, không phải “big and modern”.", "listen": "T2"}, {"id": "r9-b4", "round": "r9", "type": "mcq", "ref": "Listening · Task 2 · Statement 4", "instr": "Nghe hội thoại và quyết định câu sau đúng (True) hay sai (False).", "stem": "There is a big window next to Mai's bed.", "opts": ["True", "False"], "ans": 0, "exp": "Mai nói có “a big window next to my bed”.", "listen": "T2"}, {"id": "r9-b5", "round": "r9", "type": "mcq", "ref": "Listening · Task 2 · Statement 5", "instr": "Nghe hội thoại và quyết định câu sau đúng (True) hay sai (False).", "stem": "Mai often reads books on the balcony at weekends.", "opts": ["True", "False"], "ans": 0, "exp": "Mai thường ngồi ở balcony và đọc sách vào cuối tuần.", "listen": "T2"}], "listening": {"T1": {"title": "Task 1 – Nam’s New School", "speakers": ["Girl", "Nam"], "lines": [{"who": "Girl", "text": "Hi Nam. How do you like your new school?"}, {"who": "Nam", "text": "It's great! The teachers are very kind, and my classmates are friendly."}, {"who": "Girl", "text": "What subjects do you have today?"}, {"who": "Nam", "text": "I have English, Science, and Art. My favorite is English because the lessons are fun."}, {"who": "Girl", "text": "Do you study in the morning or in the afternoon?"}, {"who": "Nam", "text": "In the morning. My class starts at 7:15 and finishes at 11:30."}, {"who": "Girl", "text": "Wow, that's early! What do you usually do after school?"}, {"who": "Nam", "text": "I often play football with my friends in the school yard. Sometimes we swim in the school pool."}, {"who": "Girl", "text": "That sounds nice. Is your school big?"}, {"who": "Nam", "text": "Yes. It has three buildings and a large library."}]}, "T2": {"title": "Task 2 – Mai’s House", "speakers": ["Boy", "Mai"], "lines": [{"who": "Boy", "text": "Hi Mai. Where do you live?"}, {"who": "Mai", "text": "I live in a townhouse near the city center. It’s not very big, but it’s comfortable."}, {"who": "Boy", "text": "How many rooms are there?"}, {"who": "Mai", "text": "There are five rooms: two bedrooms, a living room, a kitchen, and a bathroom."}, {"who": "Boy", "text": "Which room do you like best?"}, {"who": "Mai", "text": "My bedroom. It’s small but cozy. There’s a big window next to my bed, so it’s always bright."}, {"who": "Boy", "text": "Do you have a garden?"}, {"who": "Mai", "text": "No, I don’t. But we have a nice balcony with some green plants. I often sit there and read books on weekends."}, {"who": "Boy", "text": "That sounds lovely."}]}}, "flags": [{"w": "Exercise 1 (Phonetics)", "i": "File Word không lưu định dạng gạch chân ở bất kỳ từ nào, nên game không tự thêm gạch chân (đúng yêu cầu không tự suy đoán). Nút Gợi ý nêu phần chữ cần chú ý, rút từ lời giải trong file.", "h": "Giữ đáp án theo file. Câu 10 (creative) phần gạch chân không xác định được – nên đối chiếu với đề in."}, {"w": "Exercise 2 – Question 29", "i": "Hai phương án A và B bị bỏ trống trong file gốc (chỉ còn C “am coming”, D “be coming”).", "h": "Đáp án B “is coming” lấy từ đáp án của file. A “comes” do game bổ sung để đủ 4 phương án – cần giáo viên xác nhận."}, {"w": "Exercise 3 – Question 2", "i": "Đáp án “do / get up” cho hai chỗ trống.", "h": "Làm thành 2 ô nhập, mỗi ô 5 điểm."}, {"w": "Exercise 5 – Part 1", "i": "Chỗ trống trong đoạn văn đánh số (13)–(16) nhưng các câu hỏi đánh số 1–4.", "h": "Đánh số lại (1)–(4) cho khớp câu hỏi, nội dung giữ nguyên."}, {"w": "Exercise 5 – nhãn Part", "i": "Trong đề, “My dream house” và “Notice: My Friends” cùng nằm dưới nhãn PART 2; phần đáp án gọi là Part 2 và Part 3.", "h": "Game gọi lần lượt là Part 1, Part 2, Part 3 theo phần đáp án."}, {"w": "Exercise 6", "i": "Tiêu đề ghi “(a-c)” nhưng mỗi bài có 5 câu a–e. Bài B có thể có thứ tự hợp lý khác với đáp án.", "h": "Giữ đáp án theo file (A: d-a-b-e-c; B: b-c-a-d-e)."}, {"w": "Exercise 7", "i": "Hình 4 bị cắt chữ ở mép phải ngay trong file Word (“shoes”, “house” thiếu chữ cuối); hình 3 hơi cắt ở mép dưới.", "h": "Dùng nguyên hình gốc đã trích xuất, không vẽ lại; nội dung đầy đủ của thông báo được nêu trong lời giải."}, {"w": "Exercise 9", "i": "Đề ghi “between Nick and Jasmine” nhưng hội thoại là Jack và Cody. Lựa chọn E có dấu phẩy “English class, every Saturday”.", "h": "Theo nội dung hội thoại; giữ nguyên câu E như file."}, {"w": "Exercise 10 – Q2, Q5, Q6", "i": "Có thể có cách viết đúng khác (ví dụ “our bicycles”/“bicycles”; “There is/are a table and four chairs”; Doraemon dùng “it” hay “he”).", "h": "Chấm theo đáp án file và một số biến thể đã kiểm tra; câu khác đáp án được báo là “cần giáo viên xác nhận”."}, {"w": "Exercise 11 – Q1, Q5, Q6, Q7", "i": "Có nhiều cách viết lại hợp lý. Lời giải câu 7 cũng nêu “Our English teacher’s bag is new and beautiful” nhưng đề cho sẵn phần mở đầu “The bag”.", "h": "Chấm theo đáp án file và biến thể đã kiểm tra; câu khác báo “cần giáo viên xác nhận”."}, {"w": "Listening", "i": "Không có file âm thanh gốc nào được đính kèm (chỉ có lời thoại trong phụ lục của file Word).", "h": "Dùng giọng đọc tổng hợp của trình duyệt (ghi rõ trong game) và lời thoại lấy đúng từ phụ lục. Không có bản ghi âm gốc."}], "advice": {"r1": "Ôn cách phát âm đuôi -s/-es (/s/, /z/), các âm /ɑː/, /ɔː/, /eə/, “ch” (/tʃ/, /k/) và “ea” (/iː/, /e/).", "r2": "Ôn hiện tại đơn (thêm -s/-es với ngôi thứ ba số ít), hiện tại tiếp diễn (am/is/are + V-ing; now, at the moment, Look!), trạng từ tần suất đứng trước động từ thường, giới từ vị trí và các cụm do/play/have.", "r3": "Đọc cả đoạn trước khi chọn; chú ý chủ ngữ số ít/số nhiều (is/are, has), cụm cố định (take care of, in the countryside) và các từ nối and/but/or.", "r4": "Tìm câu mở đầu (lời chào/xin phép hoặc mốc thời gian đầu tiên) rồi nối các câu theo mạch hội thoại hoặc theo thời gian.", "r5": "Đọc kỹ hình và chữ trên biển báo, chú ý từ phủ định như “Do not”, “No”, “Keep … away from”, “take off”.", "r6": "Gạch chân từ khóa trong câu hỏi, tìm câu tương ứng trong bài; với câu NOT TRUE hãy loại ba ý đúng trước.", "r7": "Đọc câu hỏi/đáp của người đối thoại: câu hỏi Yes/No cần trả lời Yes/No; câu hỏi “What are you doing…?” dùng hiện tại tiếp diễn.", "r8": "Ôn cấu trúc: sở hữu cách (Lan’s doll), There is/are ↔ has, Let’s ↔ How about + V-ing, What does … look like?, not far from ↔ near; chú ý chia động từ và mạo từ.", "r9": "Đọc câu hỏi trước khi nghe, gạch chân từ khóa về số, giờ, nơi chốn; đừng chọn đáp án chỉ “gần giống” nhưng khác một chi tiết."}, "images": {"IMG1": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAALQAAACRCAIAAADlzgXgAACF9ElEQVR4nOT9ebxlVXE2jj9Va6299xnu1HM3zQwNCKiIIiDiAKI44BCHxBg1zvpGTYzJN4mavMZoHKKGaHydcUQxDtEoKKICiszzDD3QQNPjnc60h7VW1fePfc6lEexBUd/f97c+59Pcezn33D3UrlX11FNPkari/6alECiBCIACIQQ1LKJgImKoZJERoNGTePS7nTvXbvrFL2cvuzq/Y0OYmR+POhZjItGKWoFRkIqyeFZv1DOMouHZRQBQgoKUREkBUmj9BZQZAEAKUhAAQAAQFIisgQEiEiIQKZOCpf4WrBQJA4fA5JkLazqJSw/cb/LQA9rHPfrgkx8vq5dr5rxJyDoRsWyhIDIY/h0VVUPMo+//gIv+7zIOBVQAApEQBIjD/xFjrIyoM4b7ir4Hsb/u+mvO/tr2q6/JZmfHfZUWhZRFK81SYVYwhAVGoaRCEhmREFgInATDYpRUQSBSEgEUO90N5YUveXR5aHSAQhBSJYXywltGV7H+iSiXrDDCAAcytGTRpn5vowzMQfsc9pQTj33dq7ByBYhhLJIkRBFjFcRkGITaPP/wtvF/oXHECJAyeaYIhQojGokmRIoRlUeud5/3k40XXty78VZ375ZlITbKvMEE1kqCELnRrSUo6cLn1hdbhSiQEaIFW6jfooSFn5BS/RPa6doQFr5VK1r/KAIgFkAJkah2LYAyvBF1AisEZTE2h/QS9hON7X7g9lmx4sSTDnzyk8eOPhKT40gTtTYaE0QMW2sMAYoH3BeiP4Ct/N9nHCGAKBqqiBViIUmMGAxAjJm5wS8v/8HHP8nbptu5H+/2Jwu/iG3DGCXMFINCQtpqm6isIgwBhAGAdLjFsEAYhUUg0P2PJrHe/zVApFB6wEEpjVyIgiEu1pajQkMzUqaRkTEAUiGABQYgQVEWYxPjVYyVxjxW3qVb1OTN5pGnn7rmxX+ERx+FZoZGCohEsDMQCMnOvoOHG93vdf1faBwCQjSojYNjleUlQsSO /* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function norm(s) {
  return String(s).toLowerCase().replace(/[’‘`´]/g, "'").replace(/favorite/g, 'favourite')
    .replace(/[.,!?;:"“”]/g, ' ').replace(/\s+/g, ' ').trim();
}

function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#3366ff', '#17a35f', '#f5a524', '#e04848', '#6a4cff', '#00a88f'];

function roundPool() { return ITEMS.filter(it => cfg.rounds.has(it.round)); }

function balancedPick(pool, n) {
  const g = {}; pool.forEach(it => (g[it.round] = g[it.round] || []).push(it));

  ids.forEach(id => { q[id] = Math.min(g[id].length, Math.max(1, Math.floor(n * g[id].length / total))); sum += q[id]; });
  let guard = 0;
  while (sum < n && guard++ < 2000) {
    let best = null, bs = -1e9;
    ids.forEach(id => { if (q[id] < g[id].length) { const s = n * g[id].length / total - q[id]; if (s > bs) { bs = s; best = id; } } });

  }

  const avail = availableCount();

  if (cfg.mode === 'mixed') return balancedPick(ITEMS.slice(), n);
  const pool = roundPool(); let pick = pool.slice();
  if (n < pool.length) { pick = shuffle(pool.slice()).slice(0, n); pick.sort((a, b) => IDX.get(a.id) - IDX.get(b.id)); }
  if (cfg.shuffle) shuffle(pick);
  return pick;
}

function startFromHome() {

/* ---------- session ---------- */
let timerId = null;
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function startSession(items, label) {
  stopSpeech(); stopTimer();
  S = { items, idx: 0, results: [], score: 0, label, t0: Date.now(), elapsed: 0, plays: {}, script: {}, showAll: false };
  initQ();
  if (cfg.timer) timerId = setInterval(() => { const el = document.getElementById('timer'); if (el) el.textContent = '⏱ ' + fmtTime(Date.now() - S.t0); }, 500);
  renderQuestion(); window.scrollTo(0, 0);
}
function cur() { return S.items[S.idx]; }
function initQ() {
  const it = cur();
  Q = { checked: false, hint: false, res: null, sel: null, vals: {}, seq: [], pool: [], typed: '' };
  if (it.type === 'order') Q.pool = shuffle(it.cards.map(c => c.k));
}

/* ---------- rendering of a question ---------- */
function listenBox(it) {
  if (!it.listen) return '';
  const L = DATA.listening[it.listen];
  const used = S.plays[it.listen] || 0;
  const left = cfg.plays > 0 ? Math.max(0, cfg.plays - used) : '∞';
  const shown = S.script[it.listen];
  return `<div class="listen"><div class="lt2">🎧 ${esc(L.title)}</div>
    <div class="lb"><button class="btn small" onclick="playL('${it.listen}')">▶ Nghe</button>
    <button class="btn small ghost" onclick="stopSpeech()">⏹ Dừng</button>

    ${shown ? `<div class="script">${L.lines.map(l => `<div><b>${esc(l.who)}:</b> ${esc(l.text)}</div>`).join('')}</div>` : ''}</div>`;
}
function passageHtml(it) {
  const p = it.passage;
  let h = `<div class="passage"><div class="ptitle">${esc(p.title)}</div>`;
  p.paras.forEach(t => {
    let s = esc(t);
    if (p.kind === 'cloze') {
      s = s.replace(/\[\[(\d+)\]\]/g, (m, k) => {
        k = +k;
        if (k === p.blank) {
          if (Q.checked) return `<span class="blank done">(${k}) ${esc(it.opts[it.ans])}</span>`;
          return `<span class="blank cur">(${k}) ______</span>`;
        }
        return `<span class="blank">(${k}) ____</span>`;
      });
    } else if (Q.hint && it.kw) {
      it.kw.forEach(kw => { s = s.replace(new RegExp(escRe(esc(kw)), 'gi'), m => `<mark>${m}</mark>`); });
    }
    h += `<p>${s}</p>`;
  });
  return h + '</div>';
}
function optsHtml(it) {
  return `<div class="opts ${Q.checked ? 'locked' : ''}">` + it.opts.map((o, i) => {
    let c = 'opt';
    if (Q.checked) { if (i === it.ans) c += ' correct'; else if (i === Q.sel) c += ' wrong'; }
    else if (i === Q.sel) c += ' sel';
    return `<button class="${c}" onclick="pick(${i})" aria-pressed="${i === Q.sel}"><span class="lt">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`;
  }).join('') + '</div>';
}
function fillBody(it) {
  const s = esc(it.stem).replace(/\{(\d)\}/g, (m, k) => {
    k = +k; let cls = '';
    if (Q.checked) cls = Q.res.parts[k] ? 'ok' : 'bad';
    const ph = it.acc.length > 1 ? `chỗ trống ${k + 1}` : '';
    return `<input class="fin ${cls}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="chỗ trống ${k + 1}" placeholder="${ph}" value="${esc(Q.vals[k] || '')}" ${Q.checked ? 'readonly' : ''} oninput="Q.vals[${k}]=this.value" onkeydown="inputKey(event)">`;
  });
  return `<div class="stem">${s}</div>`;
}
function orderBody(it) {
  const byK = {}; it.cards.forEach(c => byK[c.k] = c);
  const seq = Q.seq, pool = Q.pool.filter(k => !seq.includes(k));
  let h = `<div class="muted" style="font-weight:700">Thứ tự của em:</div>`;
  if (!seq.length) h += `<div class="emptyseq">Bấm vào các câu bên dưới để xếp vào đây.</div>`;
  else {
    h += '<div class="seq">';
    seq.forEach((k, pos) => {
      let st = ''; if (Q.checked) st = it.ans[pos] === k ? ' ok' : ' bad';
      h += `<div class="cs${st}"><span class="pos">${pos + 1}</span><span class="ct"><b>${k})</b> ${esc(byK[k].t)}</span>` +
        (Q.checked ? '' : `<span class="mv"><button aria-label="Đưa lên" onclick="mv('${k}',-1)" ${pos === 0 ? 'disabled' : ''}>↑</button><button aria-label="Đưa xuống" onclick="mv('${k}',1)" ${pos === seq.length - 1 ? 'disabled' : ''}>↓</button><button aria-label="Bỏ ra" onclick="unplace('${k}')">✕</button></span>`) + '</div>';
    });
    h += '</div>';
  }
  if (!Q.checked && pool.length) {
    h += `<div class="muted" style="font-weight:700;margin-top:8px">Các câu chưa xếp:</div><div class="pool">` +
      pool.map(k => `<button class="cc" onclick="place('${k}')"><b>${k})</b> ${esc(byK[k].t)}</button>`).join('') + '</div>';
  }
  return h;
}
function convoBody(it) {
  const used = Object.values(Q.vals).filter(Boolean);
  let h = '<div class="choices">' + Object.entries(it.choices).map(([l, t]) => `<div class="chc ${used.includes(l) ? 'used' : ''}"><b>${l}</b> ${esc(t)}</div>`).join('') + '</div><div class="chat">';
  it.lines.forEach(ln => {
    const right = ln.who === 'Cody';
    const hasBlank = ln.segs.some(sg => sg.b);
    h += `<div class="msg ${right ? 'r' : 'l'} ${hasBlank ? 'wide' : ''}"><div class="who">${esc(ln.who)}</div><div class="bub">`;
    ln.segs.forEach(sg => {
      if (sg.t) { h += esc(sg.t) + ' '; return; }
      const k = sg.b, curv = Q.vals[k] || '';
      if (Q.checked) {
        const ok = Q.res.parts[k], corr = it.ans[k];
        h += `<span class="fill ${ok ? 'ok' : 'bad'}">(${k}) ${esc(it.choices[corr])}</span>` + (ok ? '' : ` <span class="tiny muted">(em chọn: ${curv ? esc(curv) : 'chưa chọn'})</span>`);
      } else {
        h += `<select aria-label="Chỗ trống ${k}" onchange="setConv(${k},this.value)"><option value="">(${k}) chọn câu…</option>` +
          Object.entries(it.choices).map(([l, t]) => `<option value="${l}" ${curv === l ? 'selected' : ''} ${used.includes(l) && curv !== l ? 'disabled' : ''}>${l}. ${esc(t)}</option>`).join('') + '</select>';
      }

    h += '</div></div>';
  });
  return h + '</div>';
}
function writeBody(it) {
  const cls = Q.checked ? (Q.res.ok ? 'ok' : 'bad') : '';
  return `<div class="wprompt">${esc(it.prompt)}</div>
    <div class="warrow">→ ${it.prefix ? `<b>${esc(it.prefix)}</b> …` : ''}
    <input class="win ${cls}" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Câu trả lời" placeholder="${it.prefix ? 'Viết phần còn lại của câu…' : 'Viết câu hoàn chỉnh…'}" value="${esc(Q.typed)}" ${Q.checked ? 'readonly' : ''} oninput="Q.typed=this.value" onkeydown="inputKey(event)"></div>`;
}
function inputKey(e) { if (e.key === 'Enter') { e.preventDefault(); if (Q.checked) nextQ(); else doCheck(); } }

function feedbackHtml(it) {
  const r = Q.res;
  const cls = r.ok ? 'ok' : (r.score > 0 ? 'part' : 'bad');
  const head = r.ok ? `✅ Excellent! Chính xác! (+${r.score} điểm)`
    : (r.score > 0 ? `🟡 Gần đúng rồi! Em được +${r.score} điểm` : '❌ Try again! Hãy cố gắng nhé!');
  let extra = '';
  if (!r.ok && it.type === 'write') extra = `<div class="ans">${it.multi ? 'Câu của em chưa khớp đáp án mẫu. Bài này có thể có cách viết đúng khác – hãy nhờ giáo viên xác nhận.' : 'Câu của em chưa khớp đáp án mẫu (có thể sai ngữ pháp, chính tả hoặc khác nghĩa).'}</div>`;
  return `<div class="fb ${cls} fade"><h3>${head}</h3>
    ${r.ok ? '' : `<div class="ans"><b>Đáp án đúng:</b> ${esc(correctText(it))}</div>`}${extra}
    ${it.exp ? `<div class="exp"><b>Giải thích:</b> ${esc(it.exp)}</div>` : ''}
    ${!r.ok ? '<div class="tiny muted" style="margin-top:6px">Em có thể làm lại câu này bằng nút “Làm lại câu sai” ở màn hình tổng kết.</div>' : ''}</div>`;
}
function renderQuestion() {
  const it = cur(), total = S.items.length, r = R[it.round];
  const pct = Math.round((S.idx / total) * 100);
  let body = '';
  if (it.type === 'mcq') {
    body += listenBox(it);
    if (it.img) body += `<figure class="fig"><img src="${DATA.images[it.img]}" alt="Hình của câu hỏi (biển báo hoặc thông báo)"><figcaption>${esc(it.imgcap || '')}</figcaption></figure>`;
    if (it.passage) body += passageHtml(it);
    if (it.stem) body += `<div class="stem">${esc(it.stem)}</div>`;
    body += optsHtml(it);
  } else if (it.type === 'fill') body += fillBody(it);
  else if (it.type === 'order') body += orderBody(it);
  else if (it.type === 'convo') body += convoBody(it);
  else if (it.type === 'write') body += writeBody(it);
  const hintBtn = it.hint && !Q.checked ? `<button class="btn ghost left" onclick="toggleHint()">💡 Gợi ý</button>` : '<span class="left"></span>';
  const actions = Q.checked
    ? `<button class="btn" onclick="nextQ()">${S.idx + 1 >= total ? 'Xem kết quả 🎉' : 'Câu tiếp theo →'}</button>`
    : `${hintBtn}<button class="btn ghost" onclick="skipQ()">Bỏ qua</button><button class="btn ok" onclick="doCheck()">Kiểm tra ✔</button>`;
  app.innerHTML = `<div class="fade">
    <div class="top"><span class="pill" style="color:${r.color}">${r.icon} ${esc(r.en)}</span>
      <span class="pill">Câu ${S.idx + 1}/${total}</span><span class="pill">⭐ ${S.score} điểm</span>
      ${cfg.timer ? `<span class="pill" id="timer">⏱ ${fmtTime(Date.now() - S.t0)}</span>` : ''}
      <button class="btn small ghost" onclick="quitToHome()">✕ Thoát</button></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="card"><span class="qtag">${esc(it.ref)}</span>
      ${it.instr ? `<div class="instr">${esc(it.instr)}</div>` : ''}
      ${it.note ? `<div class="note">ℹ️ ${esc(it.note)}</div>` : ''}
      ${body}
      ${Q.hint && it.hint ? `<div class="hintbox">${esc(it.hint)}</div>` : ''}
      ${Q.checked ? feedbackHtml(it) : ''}

}
function quitToHome() { if (confirm('Thoát khỏi lượt chơi? Kết quả lượt này sẽ không được lưu.')) renderHome(); }

/* ---------- interactions ---------- */
function pick(i) { if (Q.checked) return; Q.sel = i; renderQuestion(); }
function toggleHint() { if (Q.checked) return; Q.hint = !Q.hint; renderQuestion(); }
function place(k) { if (Q.checked || Q.seq.includes(k)) return; Q.seq.push(k); renderQuestion(); }
function unplace(k) { if (Q.checked) return; Q.seq = Q.seq.filter(x => x !== k); renderQuestion(); }
function mv(k, d) { if (Q.checked) return; const i = Q.seq.indexOf(k), j = i + d; if (i < 0 || j < 0 || j >= Q.seq.length) return; [Q.seq[i], Q.seq[j]] = [Q.seq[j], Q.seq[i]]; renderQuestion(); }
function setConv(k, v) { if (Q.checked) return; Q.vals[k] = v; renderQuestion(); }
function toggleScript(id) { S.script[id] = !S.script[id]; renderQuestion(); }
function playL(id) {
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
    toast('Trình duyệt này không hỗ trợ đọc văn bản. Hãy bấm “Xem lời thoại” để đọc nội dung.'); return;
  }
  const used = S.plays[id] || 0;
  if (cfg.plays > 0 && used >= cfg.plays) { toast('Em đã dùng hết số lần nghe cho bài này.'); return; }
  S.plays[id] = used + 1;
  const el = document.getElementById('plays-' + id);
  if (el) el.textContent = cfg.plays > 0 ? Math.max(0, cfg.plays - S.plays[id]) : '∞';
  const L = DATA.listening[id];
  stopSpeech();
  const voices = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
  L.lines.forEach(ln => {
    const u = new SpeechSynthesisUtterance(ln.text);
    const sp = Math.max(0, L.speakers.indexOf(ln.who));
    u.lang = 'en-US'; u.rate = 0.9; u.pitch = sp === 0 ? 1.0 : 1.3;
    if (voices.length) u.voice = voices[sp % voices.length];
    speechSynthesis.speak(u);
  });
}

function correctText(it) {
  if (it.type === 'mcq') return `${'ABCD'[it.ans]}. ${it.opts[it.ans]}`;
  if (it.type === 'fill') return it.shown;
  if (it.type === 'order') return `${it.ans.join(' – ')} (phương án ${it.keyl})`;
  if (it.type === 'convo') return Object.keys(it.ans).map(k => `(${k}) ${it.ans[k]}`).join(', ');
  if (it.type === 'write') return it.sample;
  return '';
}
function userText(it, q) {
  if (it.type === 'mcq') return q.sel == null ? '(chưa chọn)' : `${'ABCD'[q.sel]}. ${it.opts[q.sel]}`;
  if (it.type === 'fill') { const n = it.acc.length; const a = []; for (let k = 0; k < n; k++) a.push(q.vals[k] || '(trống)'); return a.join(' / '); }
  if (it.type === 'order') return q.seq.length ? q.seq.join(' – ') : '(chưa xếp)';
  if (it.type === 'convo') return Object.keys(it.ans).map(k => `(${k}) ${q.vals[k] || '–'}`).join(', ');
  if (it.type === 'write') return q.typed.trim() ? ((it.prefix ? it.prefix + ' ' : '') + q.typed.trim()) : '(chưa viết)';
  return '';
}
function grade(it) {
  if (it.type === 'mcq') {
    if (Q.sel == null) return null;
    const ok = Q.sel === it.ans; return { ok, score: ok ? PTS : 0 };
  }
  if (it.type === 'fill') {
    const n = it.acc.length; if (!Object.values(Q.vals).some(v => String(v).trim())) return null;
    const parts = []; let good = 0;
    for (let k = 0; k < n; k++) {
      const v = norm(Q.vals[k] || ''); const ok = !!v && it.acc[k].some(a => norm(a) === v); parts.push(ok); if (ok) good++;
    }
    return { ok: good === n, score: Math.round(PTS * good / n * 100) / 100, parts };
  }
  if (it.type === 'order') {
    if (Q.seq.length < it.cards.length) return 'need-all';
    const ok = it.ans.every((k, i) => Q.seq[i] === k); return { ok, score: ok ? PTS : 0 };
  }
  if (it.type === 'convo') {
    const keys = Object.keys(it.ans); if (!keys.some(k => Q.vals[k])) return null;
    const parts = {}; let good = 0;
    keys.forEach(k => { const ok = Q.vals[k] === it.ans[k]; parts[k] = ok; if (ok) good++; });
    return { ok: good === keys.length, score: Math.round(PTS * good / keys.length * 100) / 100, parts };
  }
  if (it.type === 'write') {
    let full = Q.typed.trim(); if (!full) return null;
    if (it.prefix && !norm(full).startsWith(norm(it.prefix))) full = it.prefix + ' ' + full;
    const n = norm(full); const ok = it.acc.some(a => norm(a) === n);
    return { ok, score: ok ? PTS : 0 };
  }
  return null;
}
function doCheck() {
  if (!S || Q.checked) return;
  const it = cur(); const r = grade(it);
  if (r === 'need-all') { toast('Hãy xếp đủ tất cả các câu trước khi kiểm tra.'); return; }
  if (r === null) { toast('Hãy trả lời trước khi bấm Kiểm tra (hoặc bấm Bỏ qua).'); return; }
  Q.checked = true; Q.res = r; S.score += r.score;
  S.results.push({ item: it, status: r.ok ? 'correct' : (r.score > 0 ? 'partial' : 'wrong'), score: r.score, user: userText(it, Q), correct: correctText(it) });
  if (r.ok) confetti();
  renderQuestion();
}
function skipQ() {
  if (!S || Q.checked) return;
  const it = cur();
  Q.checked = true; Q.res = { ok: false, score: 0, parts: {} };
  S.results.push({ item: it, status: 'skipped', score: 0, user: '(bỏ qua)', correct: correctText(it) });
  nextQ();
}
function nextQ() {
  if (!S || !Q.checked) return;
  stopSpeech();
  S.idx++;
  if (S.idx >= S.items.length) { finish(); return; }
  initQ(); renderQuestion(); window.scrollTo(0, 0);
}

/* ---------- summary ---------- */
function finish() {
  stopTimer(); S.elapsed = Date.now() - S.t0;
  const byRound = {};
  S.results.forEach(r => {
    const b = byRound[r.item.round] = byRound[r.item.round] || { n: 0, got: 0, max: 0, skipped: 0, ok: 0 };
    b.n++; b.got += r.score; b.max += PTS; if (r.status === 'skipped') b.skipped++; if (r.status === 'correct') b.ok++;
  });
  let bonus = 0, bonusMax = 0;
  Object.keys(byRound).forEach(id => {
    const b = byRound[id]; bonusMax += BONUS_MAX;
    b.bonus = b.skipped === 0 ? Math.round(BONUS_MAX * b.got / b.max) : 0; bonus += b.bonus;
  });
  S.byRound = byRound; S.bonus = bonus; S.bonusMax = bonusMax;
  renderSummary(); window.scrollTo(0, 0);
}
function revHtml(r) {
  const it = r.item;
  const tagTxt = { correct: 'Đúng', wrong: 'Sai', partial: 'Đúng một phần', skipped: 'Bỏ qua' }[r.status];
  let q = '';
  if (it.type === 'mcq') q = it.passage && it.passage.kind === 'cloze' ? `${it.passage.title} – chỗ trống (${it.passage.blank})` : (it.stem || it.opts.join(' / '));
  else if (it.type === 'fill') q = it.stem.replace(/\{\d\}/g, '____');
  else if (it.type === 'order') q = 'Sắp xếp các câu: ' + it.cards.map(c => c.k + ') ' + c.t).join(' | ');
  else if (it.type === 'convo') q = 'Hoàn thành hội thoại giữa Jack và Cody';
  else q = (it.prompt || '') + (it.prefix ? ' → ' + it.prefix + ' …' : '');
  return `<div class="rev ${r.status}"><div><span class="tag ${r.status}">${tagTxt}</span><span class="tiny muted">${esc(it.ref)}</span></div>
    <div style="margin:4px 0"><b>${esc(q)}</b></div>
    ${r.status !== 'correct' ? `<div>Em chọn / viết: <b>${esc(r.user)}</b></div>` : ''}
    <div>Đáp án đúng: <b style="color:#0f7a46">${esc(r.correct)}</b></div>
    ${it.exp ? `<div class="tiny" style="margin-top:4px;color:#33405e">${esc(it.exp)}</div>` : ''}</div>`;
}
function renderSummary() {
  const N = S.results.length, maxQ = N * PTS;
  const got = S.results.reduce((a, r) => a + r.score, 0);
  const cnt = k => S.results.filter(r => r.status === k).length;
  const pct = maxQ ? Math.round(got / maxQ * 100) : 0;
  const total = got + S.bonus, totalMax = maxQ + S.bonusMax;
  const msg = pct >= 90 ? ['🌟', 'Xuất sắc! Em nắm kiến thức rất chắc.'] : pct >= 70 ? ['🎉', 'Làm tốt lắm! Chỉ cần ôn thêm vài điểm nhỏ nữa thôi.']
    : pct >= 50 ? ['💪', 'Khá lắm! Em đã có nền tảng tốt, ôn lại các câu sai là tiến bộ ngay.'] : ['🌱', 'Cố gắng lên nhé! Mỗi lần luyện tập là một bước tiến. Hãy xem lại lời giải rồi thử lại.'];
  const chart = DATA.rounds.filter(r => S.byRound[r.id]).map(r => {
    const b = S.byRound[r.id], p = Math.round(b.got / b.max * 100);
    return `<div class="hb" style="--c:${r.color}"><span>${r.icon} ${esc(r.en)}</span><div class="tr"><i style="width:${p}%"></i></div><span><b>${p}%</b> <span class="muted tiny">(${b.ok}/${b.n})</span></span></div>`;
  }).join('');
  const weak = DATA.rounds.filter(r => S.byRound[r.id] && (S.byRound[r.id].got / S.byRound[r.id].max) < 0.7);
  const advice = weak.length ? weak.map(r => `<div class="advice"><b>${r.icon} ${esc(r.en)} – ${esc(r.vn)}:</b> ${esc(DATA.advice[r.id])}</div>`).join('')
    : '<div class="advice">Chưa có chủ đề nào dưới 70%. Hãy thử “Thử thách tổng hợp” với nhiều câu hơn nhé!</div>';
  const list = S.showAll ? S.results : S.results.filter(r => r.status !== 'correct');
  const retryN = S.results.filter(r => r.status !== 'correct').length;
  app.innerHTML = `<div class="fade">
    <div class="hero"><h1>${msg[0]} Kết quả – ${esc(S.label)}</h1><p>${esc(msg[1])}</p></div>
    <div class="card" style="text-align:center">
      <div class="bigscore">${total} <span class="muted" style="font-size:22px">/ ${totalMax} điểm</span></div>
      <div class="muted">Điểm câu hỏi ${got}/${maxQ} + điểm thưởng ${S.bonus}/${S.bonusMax}</div>
      <div class="tiles" style="margin-top:12px">
        <div class="tile"><b>${pct}%</b><span>Tỉ lệ đúng</span></div>
        <div class="tile"><b style="color:var(--ok)">${cnt('correct')}</b><span>Câu đúng</span></div>
        <div class="tile"><b style="color:var(--warn)">${cnt('partial')}</b><span>Đúng một phần</span></div>
        <div class="tile"><b style="color:var(--bad)">${cnt('wrong')}</b><span>Câu sai</span></div>
        <div class="tile"><b>${cnt('skipped')}</b><span>Bỏ qua</span></div>
        ${cfg.timer ? `<div class="tile"><b>${fmtTime(S.elapsed)}</b><span>Thời gian</span></div>` : ''}
      </div></div>
    <div class="card"><h2>📊 Kết quả theo chủ đề</h2>${chart}
      <div class="tiny muted">Điểm thưởng của vòng chỉ được tính khi trả lời đủ các câu của vòng đó.</div></div>
    <div class="card"><h2>📌 Kiến thức cần ôn thêm</h2>${advice}</div>
    <div class="card"><h2>${S.showAll ? '📝 Đáp án và lời giải tất cả các câu' : '❗ Các câu cần xem lại'} (${list.length})</h2>
      ${list.length ? list.map(revHtml).join('') : '<p>Em trả lời đúng tất cả các câu. Tuyệt vời! 🎉</p>'}</div>
    <div class="btnrow">
      <button class="btn warn" onclick="retryWrong()" ${retryN ? '' : 'disabled'}>🔁 Làm lại câu sai (${retryN})</button>
      <button class="btn" onclick="replay()">▶ Chơi lại từ đầu</button>
      <button class="btn ghost" onclick="renderHome()">📚 Chọn chủ đề khác</button>
      <button class="btn ghost" onclick="toggleAll()">${S.showAll ? '🙈 Chỉ xem câu cần ôn' : '👀 Xem đáp án'}</button>
    </div></div>`;
}
function toggleAll() { S.showAll = !S.showAll; renderSummary(); }
function retryWrong() {
  const items = S.results.filter(r => r.status !== 'correct').map(r => r.item);
  if (!items.length) return;
  startSession(items, 'Làm lại câu sai');
}
function replay() {
  const items = buildSessionItems();
  startSession(items, cfg.mode === 'mixed' ? 'Thử thách tổng hợp' : 'Luyện tập theo chủ đề');
}

if ('speechSynthesis' in window) { try { speechSynthesis.getVoices(); } catch (e) {} }
renderHome();
</script>
</body>
</html>
